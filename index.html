<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Clickable mockup of the Height Automation instant quote flow. Sample data only.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 26 26%22%3E%3Crect x=%221%22 y=%221%22 width=%2224%22 height=%2224%22 rx=%223%22 fill=%22%231F3FA8%22/%3E%3Cpath d=%22M7 19V7M19 19V7M7 13h12%22 stroke=%22white%22 stroke-width=%222.4%22/%3E%3C/svg%3E">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Height Automation Instant Quote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#141C24; --muted:#56626E; --line:#CAD2D9;
  --accent:#1F3FA8; --accent-ink:#FFFFFF; --accent-soft:#E2E8F8;
  --good:#1D7548; --good-soft:#E0F1E7; --warn:#9A5B00; --warn-soft:#FBEED6; --bad:#B0261E; --bad-soft:#F8E1DE;
  --shadow:0 1px 2px rgba(20,28,36,.06),0 4px 16px rgba(20,28,36,.06);
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0E141A; --surface:#161F28; --surface-2:#1B2530; --ink:#E5EBF0; --muted:#94A2AE; --line:#2B3743;
  --accent:#86A0FF; --accent-ink:#0A1024; --accent-soft:#1D2950;
  --good:#5DC48E; --good-soft:#15301F; --warn:#E6A94B; --warn-soft:#33260E; --bad:#FF8A80; --bad-soft:#3A1A17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0E141A; --surface:#161F28; --surface-2:#1B2530; --ink:#E5EBF0; --muted:#94A2AE; --line:#2B3743;
  --accent:#86A0FF; --accent-ink:#0A1024; --accent-soft:#1D2950;
  --good:#5DC48E; --good-soft:#15301F; --warn:#E6A94B; --warn-soft:#33260E; --bad:#FF8A80; --bad-soft:#3A1A17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-stretch:85%;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5vw,46px);font-weight:800}
h2{font-size:26px;font-weight:750}
h3{font-size:18px;font-weight:700}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font:600 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:12px;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--body);letter-spacing:.04em;padding:6px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* flow strip */
.flow{display:flex;gap:4px;overflow-x:auto;padding-block:14px 6px;margin:0;list-style:none;padding-inline:0}
.flow li{flex:1 0 96px;font-size:13px;font-weight:600;color:var(--muted);border-top:3px solid var(--line);padding-top:6px}
.flow li span{font-family:var(--mono);font-weight:500;margin-right:4px}
.flow li.done{border-color:var(--accent);color:var(--ink)}
.flow li.now{border-color:var(--accent);color:var(--accent)}
.flow li.skip{opacity:.45}

/* site frame */
.site{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-top:12px}
.sitehead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-stretch:80%;font-size:20px;letter-spacing:.01em}
.brand svg{flex:none}
.nav{display:flex;gap:16px;font-size:15px;color:var(--muted)}
.nav a{color:inherit;text-decoration:none}
.nav a.on{color:var(--ink);font-weight:600}
.screen{padding:28px 20px 32px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:8px 12px;font-size:14px}
.btn.good{background:var(--good);color:var(--surface)}
.btn.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px;align-items:start}
.panel{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--surface-2)}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:8px}

/* home */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:28px;align-items:center}
.titleblock{border:1.5px solid var(--ink);border-radius:4px;font-size:13px}
.titleblock div{display:grid;grid-template-columns:120px 1fr;border-top:1px solid var(--ink)}
.titleblock div:first-child{border-top:0}
.titleblock b,.titleblock span{padding:7px 10px}
.titleblock b{border-right:1px solid var(--ink);font:600 11px/1.4 var(--body);letter-spacing:.08em;text-transform:uppercase}
.titleblock span{font-family:var(--mono)}
.steps3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px;margin-top:28px}
.steps3 > div{border-top:2px solid var(--accent);padding-top:10px}

/* upload */
.drop{border:2px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;background:var(--surface-2)}
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin-top:16px}
.scen button{text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px}
.scen button:hover{border-color:var(--accent)}
.scen b{display:block}
.scen small{color:var(--muted)}

/* measure */
canvas{width:100%;max-width:100%;aspect-ratio:4/3;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;display:block}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.ok{color:var(--good)} .no{color:var(--bad)}

/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600}
.field select,.field input[type=text],.field input[type=email]{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.hint{font-size:14px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.spec{font-family:var(--mono);font-size:13px;line-height:1.7}
.pill{display:inline-block;font:700 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px}
.pill.on{background:var(--good-soft);color:var(--good)}
.pill.practice{background:var(--accent-soft);color:var(--accent)}
.pill.paused{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* result */
.price{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:clamp(44px,8vw,64px);line-height:1}
.lines{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.lines td{padding:6px 0;border-bottom:1px solid var(--line)}
.lines td:last-child{text-align:right;font-family:var(--mono)}
.terms{font-size:14px;margin:0;padding-left:18px}
.notice{border-radius:10px;padding:12px 14px;font-size:15px}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.good{background:var(--good-soft);color:var(--good)}
.notice.info{background:var(--accent-soft);color:var(--accent)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
ul.reasons{margin:0;padding-left:20px}

/* checkout */
.co{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px}
.co .fake{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);font-family:var(--mono);font-size:14px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.tl li{border-left:3px solid var(--line);padding:4px 0 4px 10px}
.tl li.done{border-color:var(--good)}
.tl li.now{border-color:var(--accent)}
.email{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.email header{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);background:var(--surface-2)}
.email > div{padding:14px}

/* shop */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 20px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:12px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface-2)}
.stat b{display:block;font-family:var(--display);font-stretch:85%;font-size:26px}
.q{width:100%;border-collapse:collapse;font-size:15px}
.q th{text-align:left;font:600 12px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.q td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.q td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.q tr.sel td{background:var(--accent-soft)}
.tablewrap{overflow-x:auto}
.statebtns{display:inline-flex;gap:4px;flex-wrap:wrap}
.statebtns button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:600}
.statebtns button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.statebtns button:disabled{opacity:.4;cursor:not-allowed}
.log{list-style:none;margin:0;padding:0;font-size:15px}
.log li{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.log time{font-family:var(--mono);color:var(--muted);font-size:13px;padding-top:2px}
.foot{margin-top:18px;font-size:13px;color:var(--muted)}
.sitefoot{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px;padding:18px 20px;border-top:1px solid var(--line);background:var(--surface-2);font-size:14px}
.howlist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:16px}
.howlist li::marker{font-family:var(--mono);color:var(--accent);font-weight:500}
.qtable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.qtable th,.qtable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
.qtable th:first-child,.qtable td:first-child{text-align:left}
.qtable tr.cur td{background:var(--accent-soft);font-weight:700}
.qtable button{border:0;background:transparent;color:var(--accent);font-weight:600;padding:0}
.hqprice{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hqprice input{width:110px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="topbar">
    <div class="row" style="gap:10px">
      <span class="chip">Mockup · sample data · not a live store</span>
    </div>
    <div class="seg" role="group" aria-label="Choose a view">
      <button id="vBuyer" aria-pressed="true">Buyer view</button>
      <button id="vShop" aria-pressed="false">Shop view</button>
    </div>
  </div>

  <ol class="flow" id="flow" aria-label="Where you are in the process"></ol>

  <div class="site" id="site"></div>

  <p class="foot">Every price, date, order number and email here is made up for the walkthrough. Changes in the shop view (pausing, switching a material live) change what the buyer view shows.</p>
</div>

<script>
(function(){
const $ = s => document.querySelector(s);
const money = n => '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const now = () => new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
function addBusinessDays(d, n){ const x = new Date(d); while(n > 0){ x.setDate(x.getDate()+1); const w = x.getDay(); if(w !== 0 && w !== 6) n--; } return x; }
const fmtDate = d => d.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const SCEN = {
  plate:   {file:'mounting-plate.step', title:'Mounting plate', dims:[4,3,0.5], vol:5.42, holes:4, bodies:1, intricate:false, material:'al6061', note:'Simple part, aluminum, gets an instant price'},
  bracket: {file:'angle-bracket.step', title:'Angle bracket', dims:[3,2,2], vol:3.10, holes:2, bodies:1, intricate:false, material:'ss304', note:'Stainless is still priced by the team'},
  housing: {file:'sensor-housing.step', title:'Sensor housing', dims:[2.5,2.5,1.25], vol:4.05, holes:1, bodies:1, intricate:true, material:'al6061', threads:true, note:'Threads and a deep pocket go to a person'},
  dxf:     {file:'flat-pattern.dxf', title:'Flat pattern', dxf:true, material:'al6061', note:'2D drawings are always quoted by the team'}
};
const S = {
  view:'buyer', step:'home', scen:'plate', material:'al6061', qty:10,
  dec:{threads:false, tight:false, drawing:false, own:false}, country:'US',
  email:'buyer@example.com', codeSent:false, verified:false, attest:false, terms:false,
  payState:'idle', paused:false, pauseReason:'', cap:500, maxQty:10, perDay:10, openCap:3, rampDone:2,
  shopTab:'queue', selOrder:null, nextOrder:1042, nextHQ:2031, hold:900, holdTimer:null,
  materials:{
    al6061:{name:'6061 aluminum', lb:3.10, date:'Sep 15', jobs:12, gate:true,  state:'on',       factor:1.00},
    al7075:{name:'7075 aluminum', lb:5.40, date:'Sep 15', jobs:7,  gate:false, state:'practice', factor:1.28},
    ss304: {name:'304 stainless', lb:2.90, date:'Sep 12', jobs:4,  gate:false, state:'practice', factor:1.85},
    st1018:{name:'1018 steel',    lb:1.10, date:'Sep 12', jobs:9,  gate:false, state:'practice', factor:1.35},
    delrin:{name:'Delrin (acetal)',lb:6.20, date:'Sep 10', jobs:2,  gate:false, state:'practice', factor:0.90}
  },
  orders:[
    {id:1041, part:'Spacer block', material:'al6061', qty:5, total:164.00, email:'ops@example.org', status:'review', due:addBusinessDays(new Date(),1), risk:'Low', match:true}
  ],
  hand:[{id:'HQ-2030', part:'Manifold, 7075', reason:'7075 aluminum is quoted by the team', silent:612.00}],
  log:[{t:'8:02 AM', m:'Order #1041 paid. Review due in 1 business day.'}]
};

/* pricing (sample) */
function unitPrice(scen, mat, qty){
  const base = scen.vol * 3.1 + 5.8; // metal and cutting, sample
  const setup = 60;
  return Math.round((base * S.materials[mat].factor + setup / qty) * 100) / 100;
}
function gate(){
  const sc = SCEN[S.scen], m = S.materials[S.material], r = [];
  if (sc.dxf) r.push('2D drawings are quoted by our team.');
  if (S.paused) r.push('Instant pricing is paused right now.');
  if (!sc.dxf && m.state !== 'on') r.push(m.name + ' is priced by our team for now.');
  if (S.dec.threads) r.push('Threads need a person to check them.');
  if (S.dec.tight) r.push('Tolerances tighter than ±0.005 in are quoted by our team.');
  if (S.dec.drawing) r.push('Parts that come with a drawing are quoted by our team.');
  if (S.dec.own) r.push('Parts made from your own material are quoted by our team.');
  if (sc.closed === false) r.push('The file isn\'t a closed solid, so we can\'t measure it exactly.');
  if (sc.bodies > 1) r.push('The file has more than one separate part in it.');
  if (sc.intricate) r.push(sc.custom ? 'This shape needs a closer look (pockets or thin walls).' : 'This shape needs a closer look (deep pocket).');
  if (S.country !== 'US') r.push('Instant orders ship to US addresses only.');
  if (S.qty > S.maxQty) r.push('Orders over ' + S.maxQty + ' pieces are quoted by our team.');
  let unit = 0, total = 0;
  if (!sc.dxf){ unit = unitPrice(sc, S.material, S.qty); total = unit * S.qty; }
  if (!sc.dxf && total > S.cap) r.push('Orders over ' + money(S.cap) + ' are quoted by our team.');
  const open = S.orders.filter(o => o.status === 'review').length;
  if (open >= S.openCap && r.length === 0) r.push('Our review queue is full; our team will quote this instead.');
  return {instant: r.length === 0, reasons:r, unit, total};
}

/* flow strip */
const FLOW = ['Upload','Measure','Details','Price','Pay','Review','Make and ship'];
function flowIndex(){
  if (S.view === 'shop') return 5;
  return {home:-1, how:-1, upload:0, measure:1, details:2, result:3, checkout:4, done:5, requested:3}[S.step];
}
function renderFlow(){
  const i = flowIndex(), hand = S.step === 'requested';
  $('#flow').innerHTML = FLOW.map((f,k) => {
    let c = k < i ? 'done' : (k === i ? 'now' : '');
    if (hand && k === 4) c = 'skip';
    return '<li class="'+c+'"><span>'+(k+1)+'</span>'+f+'</li>';
  }).join('');
}

/* shell */
const LOGO = '<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 19V7M19 19V7M7 13h12" stroke="currentColor" stroke-width="2.4"/></svg>';
function head(nav){
  return '<div class="sitehead"><div class="brand">'+LOGO+'Height Automation</div><nav class="nav">'+nav+'</nav></div>';
}
function render(){
  $('#vBuyer').setAttribute('aria-pressed', S.view === 'buyer');
  $('#vShop').setAttribute('aria-pressed', S.view === 'shop');
  renderFlow();
  const site = $('#site');
  if (S.view === 'shop'){ site.innerHTML = shop(); bindShop(); return; }
  const onQuote = S.step !== 'home';
  const isQ = !['home','how'].includes(S.step);
  const nav = '<a href="#" data-go="home" class="'+(S.step==='home'?'on':'')+'">Home</a><a href="#" data-go="how" class="'+(S.step==='how'?'on':'')+'">How it works</a><a href="#" data-go="upload" class="'+(isQ?'on':'')+'">Get a quote</a>';
  const foot = '<div class="sitefoot"><div><b>Height Automation</b><br>CNC machining · Grain Valley, Missouri<br>Mon to Fri, 7 AM to 4 PM Central</div><div class="stack-s"><span>Terms of sale</span><span>Refund policy</span><span>Privacy policy</span></div><div class="hint">Instant orders ship to US addresses only.<br>Every order is reviewed by a machinist before production.</div></div>';
  site.innerHTML = head(nav) + '<div class="screen">' + buyer() + '</div>' + foot;
  bindBuyer();
}

/* buyer screens */
function buyer(){
  switch(S.step){
    case 'home': return home();
    case 'how': return how();
    case 'upload': return upload();
    case 'measure': return measure();
    case 'details': return details();
    case 'result': return result();
    case 'checkout': return checkout();
    case 'done': return done();
    case 'requested': return requested();
  }
}
function home(){
  return '<div class="hero"><div class="stack">'
   + '<span class="label">CNC machining · Grain Valley, Missouri</span>'
   + '<h1>Drop your part file. Get a price in seconds.</h1>'
   + '<p class="muted" style="max-width:60ch">Simple parts in materials we have proven get an instant, fixed price you can pay right away. Everything else gets a quote from our team within one business day. A machinist checks every order before any metal is cut.</p>'

let raf = null;
function drawPart(){
  const cv = $('#cv'); if (!cv) return;
  const ctx = cv.getContext('2d'), sc = SCEN[S.scen];
  const cs = getComputedStyle(document.documentElement);
  const ink = cs.getPropertyValue('--ink').trim(), acc = cs.getPropertyValue('--accent').trim(), line = cs.getPropertyValue('--muted').trim();
  const [L,W,H] = sc.dims, k = 70 / Math.max(L,W,H) * 1.6;
  let a = 0.6;
  function P(x,y,z){ const ca=Math.cos(a), sa=Math.sin(a); const X = x*ca - y*sa, Y = x*sa + y*ca; return [320 + X*k, 250 + (Y*0.5 - z)*k]; }

    ctx.clearRect(0,0,640,480);
    if (sc.custom){ drawMesh(ctx, a); ctx.fillStyle=line; ctx.font='13px "IBM Plex Mono", monospace'; ctx.fillText(sc.dims.map(d=>d.toFixed(3)).join(' × ')+' in', 16, 462); if (!reduce){ a += 0.006; raf = requestAnimationFrame(frame); } return; }
    const x0=-L/2,x1=L/2,y0=-W/2,y1=W/2;
    const top=[[x0,y0,H/2],[x1,y0,H/2],[x1,y1,H/2],[x0,y1,H/2]], bot=top.map(p=>[p[0],p[1],-H/2]);
    const faces=[[0,1],[1,2],[2,3],[3,0]].map(([i,j])=>({pts:[top[i],top[j],bot[j],bot[i]], d:(top[i][0]+top[j][0])*Math.sin(a)+(top[i][1]+top[j][1])*Math.cos(a)}));
    faces.sort((p,q)=>p.d-q.d);

    faces.forEach((f,i)=>{ ctx.beginPath(); f.pts.forEach((p,n)=>{const q=P(...p); n?ctx.lineTo(...q):ctx.moveTo(...q);}); ctx.closePath(); ctx.fillStyle = acc; ctx.globalAlpha = 0.10 + i*0.05; ctx.fill(); ctx.globalAlpha=1; ctx.stroke(); });
    ctx.beginPath(); top.forEach((p,n)=>{const q=P(...p); n?ctx.lineTo(...q):ctx.moveTo(...q);}); ctx.closePath(); ctx.fillStyle=acc; ctx.globalAlpha=0.22; ctx.fill(); ctx.globalAlpha=1; ctx.stroke();

    else if (sc.holes === 2) spots.push([x0+L*0.25,0],[x1-L*0.25,0]);
    else spots.push([0,0]);

    ctx.fillStyle=line; ctx.font='13px "IBM Plex Mono", monospace';
    ctx.fillText(L.toFixed(3)+' × '+W.toFixed(3)+' × '+H.toFixed(3)+' in', 16, 462);

  }

}

/* real STL reading and measuring */
function parseSTL(buf){
  const dv = new DataView(buf);
  if (buf.byteLength >= 84){
    const n = dv.getUint32(80, true);
    if (84 + n * 50 === buf.byteLength){
      const t = new Float32Array(n * 9);
      for (let i = 0; i < n; i++) for (let k = 0; k < 9; k++) t[i*9+k] = dv.getFloat32(84 + i*50 + 12 + k*4, true);
      return t;
    }
  }
  const txt = new TextDecoder().decode(buf), nums = [];
  const re = /vertex\s+([-+\d.eE]+)\s+([-+\d.eE]+)\s+([-+\d.eE]+)/g; let m;
  while ((m = re.exec(txt))) nums.push(+m[1], +m[2], +m[3]);
  if (!nums.length || nums.length % 9) throw new Error('not an STL');
  return new Float32Array(nums);
}
function measureMesh(t){
  const n = t.length / 9;
  let mn = [Infinity,Infinity,Infinity], mx = [-Infinity,-Infinity,-Infinity];
  for (let i = 0; i < t.length; i += 3) for (let k = 0; k < 3; k++){ mn[k] = Math.min(mn[k], t[i+k]); mx[k] = Math.max(mx[k], t[i+k]); }
  const span = Math.max(mx[0]-mn[0], mx[1]-mn[1], mx[2]-mn[2]) || 1, q = span * 1e-5;
  const ids = new Map(), tri = new Int32Array(n * 3);
  for (let i = 0; i < n * 3; i++){
    const key = Math.round(t[i*3]/q)+','+Math.round(t[i*3+1]/q)+','+Math.round(t[i*3+2]/q);
    let id = ids.get(key); if (id === undefined){ id = ids.size; ids.set(key, id); } tri[i] = id;
  }
  let vol = 0, area = 0;
  for (let i = 0; i < n; i++){
    const a = i*9, ax=t[a],ay=t[a+1],az=t[a+2], bx=t[a+3],by=t[a+4],bz=t[a+5], cx=t[a+6],cy=t[a+7],cz=t[a+8];
    vol += (ax*(by*cz-bz*cy) - ay*(bx*cz-bz*cx) + az*(bx*cy-by*cx)) / 6;
    const ux=bx-ax,uy=by-ay,uz=bz-az, wx=cx-ax,wy=cy-ay,wz=cz-az;
    area += Math.hypot(uy*wz-uz*wy, uz*wx-ux*wz, ux*wy-uy*wx) / 2;
  }
  const edges = new Map();
  for (let i = 0; i < n; i++) for (let k = 0; k < 3; k++){
    const a = tri[i*3+k], b = tri[i*3+(k+1)%3], key = a < b ? a+'_'+b : b+'_'+a;
    edges.set(key, (edges.get(key) || 0) + 1);
  }
  let closed = true; for (const c of edges.values()) if (c !== 2){ closed = false; break; }
  const par = Array.from({length:ids.size}, (_, i) => i), f = x => { while (par[x] !== x){ par[x] = par[par[x]]; x = par[x]; } return x; };
  for (let i = 0; i < n; i++){ par[f(tri[i*3])] = f(tri[i*3+1]); par[f(tri[i*3+1])] = f(tri[i*3+2]); }
  const roots = new Set(); for (let i = 0; i < ids.size; i++) roots.add(f(i));
  const bodies = roots.size, chi = ids.size - edges.size + n;
  const holes = closed ? Math.max(0, Math.round((2 * bodies - chi) / 2)) : 0;
  return {dims:[mx[0]-mn[0], mx[1]-mn[1], mx[2]-mn[2]], vol:Math.abs(vol), area, closed, bodies, holes, tris:n, mn, mx};
}
function applyUnits(){
  const u = S.upload, m = u.m, f = u.units === 'mm' ? 1/25.4 : 1;
  const dims = m.dims.map(d => d * f), vol = m.vol * f * f * f, area = m.area * f * f;
  const bboxV = dims[0]*dims[1]*dims[2], bboxA = 2*(dims[0]*dims[1] + dims[1]*dims[2] + dims[0]*dims[2]);
  const fill = vol / (bboxV || 1), ratio = (area / (vol || 1)) / (bboxA / (bboxV || 1));
  const title = u.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').replace(/^./, c => c.toUpperCase());
  SCEN.custom = {file:u.name, title, dims, rawDims:m.dims, vol, holes:m.holes, bodies:m.bodies, closed:m.closed, tris:m.tris,
    intricate: fill < 0.2 || ratio > 1.8, material:'al6061', custom:true, note:'Your file'};
}
function takeFile(file){
  if (!file) return;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  S.uploadMsg = '';
  if (file.size > 20 * 1024 * 1024){ S.uploadMsg = 'That file is over 20 MB. On the live page you would paste a share link, and our team would quote it.'; render(); return; }
  if (ext === 'step' || ext === 'stp'){ takeStep(file); return; }
  if (ext === 'dxf'){ S.scen = 'dxf'; SCEN.dxf.file = file.name; S.material = 'al6061'; S.qty = 1; S.measured = false; go('measure'); return; }
  if (ext !== 'stl'){ S.uploadMsg = 'We read STEP, STL and DXF files. Anything else goes to our team as a quote request.'; render(); return; }
  file.arrayBuffer().then(buf => {
    let t; try { t = parseSTL(buf); } catch(e){ S.uploadMsg = 'We couldn\'t read that STL file. On the live page it would go to our team as a quote request.'; render(); return; }
    const m = measureMesh(t);
    S.upload = {name:file.name, t, m, units:'', guess: Math.max(...m.dims) > 30 ? 'mm' : 'in'};
    applyUnitsGuess();
    S.scen = 'custom'; S.material = 'al6061'; S.qty = 10; S.dec = {threads:false, tight:false, drawing:false, own:false}; S.measured = false;
    go('measure');
  });
}
const OCCT = 'https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/';
let occtP = null;
function loadOcct(){
  if (!occtP) occtP = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = OCCT + 'occt-import-js.js';
    s.onload = () => { try { window.occtimportjs({locateFile: f => OCCT + f}).then(res, rej); } catch(e){ rej(e); } };
    s.onerror = rej; document.head.appendChild(s);
  });
  return occtP;
}
function takeStep(file){
  S.uploadMsg = ''; S.uploadInfo = 'Loading the STEP reader. The first file takes a few seconds.'; render();
  Promise.all([loadOcct(), file.arrayBuffer()]).then(([occt, buf]) => {
    const r = occt.ReadStepFile(new Uint8Array(buf), {linearUnit:'inch', linearDeflectionType:'bounding_box_ratio', linearDeflection:0.002, angularDeflection:0.5});
    if (!r || !r.success || !r.meshes.length) throw new Error('read failed');
    const parts = [];
    for (const m of r.meshes){ const p = m.attributes.position.array, ix = m.index.array; for (let i = 0; i < ix.length; i++){ const v = ix[i]*3; parts.push(p[v], p[v+1], p[v+2]); } }
    const t = new Float32Array(parts), mm = measureMesh(t);
    mm.bodies = r.meshes.length; mm.closed = true;
    S.upload = {name:file.name, t, m:mm, units:'in', guess:'in', step:true};
    S.uploadInfo = '';
    applyUnits(); SCEN.custom.stepFile = true;
    S.scen = 'custom'; S.material = 'al6061'; S.qty = 10; S.dec = {threads:false, tight:false, drawing:false, own:false}; S.measured = false;
    go('measure');
  }).catch(() => {
    S.uploadInfo = '';
    S.uploadMsg = 'This viewer couldn\'t load the STEP reader, or couldn\'t read the file. The live quote page reads STEP files exactly. Try an STL file here, or one of the sample parts below.';
    render();
  });
}
function applyUnitsGuess(){ const keep = S.upload.units; S.upload.units = S.upload.guess; applyUnits(); S.upload.units = keep; }
function drawMesh(ctx, a){
  const u = S.upload, t = u.t, m = u.m, n = m.tris;
  const c = [(m.mn[0]+m.mx[0])/2, (m.mn[1]+m.mx[1])/2, (m.mn[2]+m.mx[2])/2];
  const span = Math.max(...m.dims) || 1, k = 300 / span;
  const cs = getComputedStyle(document.documentElement);
  const acc = cs.getPropertyValue('--accent').trim(), ink = cs.getPropertyValue('--ink').trim();
  const ca = Math.cos(a), sa = Math.sin(a), tilt = 0.55, ct = Math.cos(tilt), st = Math.sin(tilt);
  const proj = new Float32Array(n * 9), order = new Array(n);
  for (let i = 0; i < n * 3; i++){
    const x = t[i*3]-c[0], y = t[i*3+1]-c[1], z = t[i*3+2]-c[2];
    const X = x*ca - y*sa, Y = x*sa + y*ca, Y2 = Y*ct - z*st, Z2 = Y*st + z*ct;
    proj[i*3] = 320 + X*k; proj[i*3+1] = 240 - Z2*k; proj[i*3+2] = Y2;
  }
  for (let i = 0; i < n; i++) order[i] = i;
  order.sort((p, q) => (proj[q*9+2]+proj[q*9+5]+proj[q*9+8]) - (proj[p*9+2]+proj[p*9+5]+proj[p*9+8]));
  ctx.fillStyle = acc; ctx.strokeStyle = ink; ctx.lineWidth = 0.4;
  for (const i of order){
    const o = i*9, ux = proj[o+3]-proj[o], uy = proj[o+4]-proj[o+1], wx = proj[o+6]-proj[o], wy = proj[o+7]-proj[o+1];
    const facing = ux*wy - uy*wx;
    ctx.beginPath(); ctx.moveTo(proj[o], proj[o+1]); ctx.lineTo(proj[o+3], proj[o+4]); ctx.lineTo(proj[o+6], proj[o+7]); ctx.closePath();
    ctx.globalAlpha = facing < 0 ? 0.55 : 0.22; ctx.fill(); ctx.globalAlpha = 0.35; ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function go(step){ S.step = step; if (step!=='result') stopHold(); render(); window.scrollTo({top:0, behavior: reduce?'auto':'smooth'}); }
function startHold(){ stopHold(); S.holdTimer = setInterval(()=>{ if (S.step!=='result'){stopHold();return;} S.hold = Math.max(0,S.hold-1); const h=document.querySelector('.hint.mono'); if(h){ const mm=Math.floor(S.hold/60), ss=String(S.hold%60).padStart(2,'0'); h.textContent='Price held for '+mm+':'+ss+'. After you click Pay, you have 24 hours to finish checkout.'; } }, 1000); }
function stopHold(){ clearInterval(S.holdTimer); S.holdTimer=null; }
function placeOrder(){
  const t = totals(), sc = SCEN[S.scen], id = S.nextOrder++;
  const paidAt = new Date();
  S.orders.push({id, part:sc.title, material:S.material, qty:S.qty, total:t.sub, email:S.email, status:'review', due:addBusinessDays(paidAt,1), paidAt, risk:'Low', match:true, dims:sc.dims, vol:sc.vol, holes:sc.holes, file:sc.file});
  S.log.unshift({t:now(), m:'Order #'+id+' paid, '+money(t.sub)+'. Review due '+fmtDate(addBusinessDays(paidAt,1))+'.'});
  go('done');
}
function sendRequest(){
  const g = gate(), sc = SCEN[S.scen], id = 'HQ-' + (S.nextHQ++);
  const silent = sc.dxf ? null : g.total;
  S.hand.push({id, part:sc.title+', '+S.materials[S.material].name, reason:g.reasons[0], silent});
  S.log.unshift({t:now(), m:'Quote request '+id+' received. '+(silent?'Practice price logged: '+money(silent)+'.':'No automatic price (2D drawing).')});
  go('requested');
}

    if (!(v > 0)){ inp.setCustomValidity('Enter your price in dollars, for example 480'); inp.reportValidity(); return; }
    h.sent = true; h.teamPrice = v; h.gap = h.silent ? (h.silent - v) / v * 100 : 0;
    S.log.unshift({t:now(), m:'Quote '+id+' sent at '+money(v)+' with a pay link.'+(h.silent?' Practice price was '+money(h.silent)+' ('+(h.gap>=0?'+':'')+h.gap.toFixed(1)+'%). Added to the calibration log.':'')}); render(); });
}

$('#vBuyer').onclick=()=>{ S.view='buyer'; render(); };
$('#vShop').onclick=()=>{ S.view='shop'; if(!S.selOrder) S.selOrder=S.orders[0].id; render(); };
S.selOrder = 1041;
render();
})();
</script>
